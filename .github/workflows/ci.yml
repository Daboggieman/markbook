name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (strict on grading and access)
        run: mypy src/app/grading src/app/access

      - name: Import-linter (module boundaries)
        run: lint-imports --config contracts.ini

      - name: Unit + API tests (no DB)
        run: pytest tests/unit tests/api -q

      - name: DB tests (real Postgres via testcontainers)
        run: pytest tests -m rls -q
        # testcontainers needs no service container; it starts its own postgres.

  openapi-diff:
    name: OpenAPI breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Serve OpenAPI and snapshot
        run: |
          echo "OpenAPI diff gate lands with the first router (Phase 1)."
          # The contract of record is /openapi.json; CI diffs it against main.
          # See docs/build_docs/03-api-design.md.
