# Alembic configuration. Generated from pyproject.toml's [tool.alembic] section.
# Managed here as a standalone file so it's accessible to both `alembic` CLI and
# docker run alembic commands.

[alembic]
script_location = apps/api/migrations
prepend_sys_path = apps/api/src
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
