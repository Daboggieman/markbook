# Import-linter contract — module dependency rule (spec §3, build_docs/01).
# Enforced in CI: a red boundary is a stop, not a warning.
# Run: lint-imports --config apps/api/contracts.ini   (from repo root)
#      or: cd apps/api && lint-imports                (finds contracts.ini)
#
# Note: the "no-cross-repository" contract adds forbidden_modules for
# .repository submodules. Those modules don't exist yet (Phase 1). The
# ignore_imports entries exist to allow a module to import its own repository
# (the self-import is legal; cross-module is forbidden). They are harmless
# when the repository modules don't exist yet (ignore entries simply never
# match). They activate when Phase 1 creates repository.py in each module.

[importlinter]
root_package = app
# Suppress fatal errors for ignore_imports that don't match yet; they become
# active in Phase 1 when repository.py files are added. Downgrade to warning.
unmatched_ignore_imports_alerting = warning

[importlinter:contract:platform-kernel]
name = platform depends on nothing
type = forbidden
source_modules = app.platform
forbidden_modules =
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit

[importlinter:contract:no-cross-repository]
name = no module reaches into another module repository
type = forbidden
source_modules =
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit
forbidden_modules =
    app.identity.repository
    app.access.repository
    app.people.repository
    app.academic.repository
    app.assessment.repository
    app.grading.repository
    app.workflow.repository
    app.documents.repository
    app.sync.repository
    app.audit.repository
# NOTE: add self-import ignore entries here when Phase 1 creates repository.py.
# Example: ignore_imports = app.identity -> app.identity.repository
# Without them, Phase 1 needs them to prevent the self-import (module -> its
# own .repository) from being flagged as forbidden.

[importlinter:contract:workflow-over-grading]
name = workflow layer sits above grading
type = layers
layers =
    app.workflow
    app.grading

[importlinter:contract:engine-is-pure]
name = grading engine is a pure module
type = forbidden
source_modules = app.grading.engine
forbidden_modules =
    app.platform
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit
