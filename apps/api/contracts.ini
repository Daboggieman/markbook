# Import-linter contract — module dependency rule (spec §3, build_docs/01).
# Enforced in CI: a red boundary is a stop, not a warning.
# Run: lint-imports --config apps/api/contracts.ini   (from repo root)
#      or: cd apps/api && lint-imports                (finds contracts.ini)

[importlinter]
root_package = app

[importlinter:contract:platform-kernel]
name = platform depends on nothing
type = forbidden
source_modules = app.platform
forbidden_modules =
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit

[importlinter:contract:no-cross-module-repositories]
name = no module reaches into another module's repository (tables)
type = forbidden
source_modules =
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit
forbidden_modules =
    app.identity.repository
    app.access.repository
    app.people.repository
    app.academic.repository
    app.assessment.repository
    app.grading.repository
    app.workflow.repository
    app.documents.repository
    app.sync.repository
    app.audit.repository
ignore_imports =
    app.identity -> app.identity.repository
    app.access -> app.access.repository
    app.people -> app.people.repository
    app.academic -> app.academic.repository
    app.assessment -> app.assessment.repository
    app.grading -> app.grading.repository
    app.workflow -> app.workflow.repository
    app.documents -> app.documents.repository
    app.sync -> app.sync.repository
    app.audit -> app.audit.repository

[importlinter:contract:workflow-over-grading]
name = workflow sits above grading (may call it); nothing below grading imports workflow
type = layers
layers =
    app.workflow
    app.grading

[importlinter:contract:engine-is-pure]
name = the calculation engine is a pure module (D9) — no imports from the app
type = forbidden
source_modules = app.grading.engine
forbidden_modules =
    app.platform
    app.identity
    app.access
    app.people
    app.academic
    app.assessment
    app.grading
    app.workflow
    app.documents
    app.sync
    app.audit
