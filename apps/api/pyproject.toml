[project]
name = "markbook-api"
version = "0.1.0"
description = "Markbook API — modular monolith (FastAPI + SQLAlchemy + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.0",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "passlib[argon2]>=1.7.4",
    "redis>=5.2",
    "arq>=0.26",
    "uuid7>=0.1.0",
    "structlog>=24.4",
    "passlib[argon2]>=1.7",
    "PyJWT>=2.10",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "ASYNC"]
# S101 (assert) is fine in tests; S608 flags string-built SQL, which we want kept.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Alembic env.py must set up sys.path before importing app modules.
"migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.grading.*", "app.access.*"]
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "rls: tests that require real Postgres with RLS enabled",
]
